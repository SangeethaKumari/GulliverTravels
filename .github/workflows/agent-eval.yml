name: Ambient Travel Agent Evaluation Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Project Infrastructure
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        # Installs your local backend module packages in editable development mode
        if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e .; fi

    - name: Create Reports Directory
      run: mkdir -p reports

    - name: Run Agent Evaluation Dataset
      id: run_tests
      run: |
        python -m pytest backend/tests/test_eval_matrix.py --junitxml=reports/eval_report.xml

    # ========================================================
    # 🚨 INTEGRATION: TEAM SLACK ALERT ON FAILURE
    # ========================================================
    - name: Send Slack Alert on Test Failure
      # This block will ONLY execute if your pytest step fails or crashes
      if: failure() 
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_TITLE: "🚨 CRITICAL: Ambient Travel Agent Pipeline Failure!"
        SLACK_COLOR: "#FF0000"  # Solid Red border alert block
        SLACK_MESSAGE: |
          *Commit:* ${{ github.sha }} 
          *Triggered By:* ${{ github.actor }}
          *Event Type:* Push/PR Build
          
          *Error Detail:* An evaluation test case has failed. A recent code modification has blocked a critical database state-sync transaction, broken an orchestration boundary threshold math logic, or short-circuited the decision ledger.
        SLACK_FOOTER: "Ambient Travel Orchestrator CI Automated Testing Pipeline"

    # ========================================================
    # 💾 INTEGRATION: AUTOMATED FORENSIC LOG UPLOAD
    # ========================================================
    - name: Upload Forensic Debugging Logs
      # This ensures that if a test fails, you get the logs to fix it immediately
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: forensic-pipeline-logs
        # Captures your local test state file and the XML failure matrix report
        path: |
          *.db
          reports/eval_report.xml